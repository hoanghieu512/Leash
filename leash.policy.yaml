# Leash — your trading rules, written to be read rather than executed.
# Changes take effect on the very next order.

profile: conservative
capital_usdt: 100

limits:
  max_notional_per_order: 15      # 15% of the account; Binance spot minimum notional is 5 USDT
  max_orders_per_hour: 6
  min_seconds_between_orders: 60
  symbol_allowlist: [BTCUSDT, ETHUSDT, BNBUSDT]
  markets: [spot]                 # margin and futures are refused outright

behavior:
  daily_loss_kill_switch_pct: 5   # once reached, opening is locked until 00:00 UTC; closing stays allowed
  revenge_cooldown_minutes: 15    # after a losing close, that symbol is off limits for a while
  no_size_up_after_losses: 2      # two losses in a row and the next order may not be larger
  require_reason: true            # no order without a declared reason via leash.check_order
