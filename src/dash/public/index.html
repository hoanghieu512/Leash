<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEASH — bảng kiểm soát</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #05070a;
    --panel: #0c1015;
    --panel-lift: #121821;
    --edge: #1e2833;
    --edge-bright: #33424f;
    --text: #e8eef4;
    --dim: #6d7d8c;
    --faint: #55636f;

    --armed: #12e08a;
    --armed-glow: rgba(18, 224, 138, .16);
    --locked: #ff3b30;
    --locked-glow: rgba(255, 59, 48, .22);
    --warn: #ffb020;

    --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: var(--mono);
    font-weight: 300;
    min-height: 100vh;
    padding: 22px;
    display: grid;
    gap: 18px;
    grid-template-rows: auto auto 1fr;
    /* Faint engineering grid — the surface this instrument is bolted to. */
    background-image:
      linear-gradient(rgba(255,255,255,.017) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.017) 1px, transparent 1px);
    background-size: 44px 44px;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: baseline; gap: 16px;
    border-bottom: 1px solid var(--edge); padding-bottom: 12px;
  }
  .wordmark { font-weight: 800; font-size: 20px; letter-spacing: .34em; }
  .tagline { color: var(--faint); font-size: 11px; letter-spacing: .18em; }
  .clock { margin-left: auto; color: var(--dim); font-size: 12px; letter-spacing: .1em; }

  /* ---------- status + gauges ---------- */
  .top { display: grid; grid-template-columns: minmax(420px, 1fr) 1.35fr; gap: 18px; }

  .status {
    position: relative; overflow: hidden;
    background: var(--panel); border: 1px solid var(--edge);
    padding: 30px 34px; display: grid; gap: 22px; align-content: center;
  }
  .status::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 12% 0%, var(--armed-glow), transparent 62%);
    transition: background .45s ease;
  }
  .status > * { position: relative; }

  .lamp-row { display: flex; align-items: center; gap: 20px; }
  .lamp {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--armed); box-shadow: 0 0 26px 5px var(--armed-glow);
    flex: none;
  }
  .verdict { font-weight: 800; font-size: clamp(52px, 6.6vw, 92px); letter-spacing: .06em; line-height: .92; }
  .verdict-note { color: var(--dim); font-size: 13px; letter-spacing: .05em; line-height: 1.7; max-width: 46ch; }

  /* Locked: the whole instrument turns into an alarm. */
  body.locked { --armed: var(--locked); --armed-glow: var(--locked-glow); }
  body.locked .status { border-color: rgba(255,59,48,.5); }
  body.locked .lamp { animation: pulse 1.15s ease-in-out infinite; }
  body.locked .status::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 42%, rgba(255,59,48,.13) 50%, transparent 58%);
    background-size: 260% 100%;
    animation: sweep 2.6s linear infinite;
  }
  @keyframes pulse { 50% { opacity: .28; box-shadow: 0 0 8px 1px var(--locked-glow); } }
  @keyframes sweep { to { background-position: -160% 0; } }

  .kill {
    justify-self: start;
    font-family: var(--mono); font-weight: 700; font-size: 13px; letter-spacing: .2em;
    color: var(--ink); background: var(--locked);
    border: 0; padding: 15px 30px; cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  .kill:hover { filter: brightness(1.14); }
  .kill:active { transform: translateY(1px); }
  .kill[data-on="true"] { background: transparent; color: var(--armed); border: 1px solid var(--armed); }

  /* ---------- gauges ---------- */
  .gauges { display: grid; gap: 12px; align-content: start; }
  .gauge { background: var(--panel); border: 1px solid var(--edge); padding: 17px 20px; display: grid; gap: 11px; }
  .gauge-head { display: flex; align-items: baseline; gap: 12px; }
  .gauge-label { font-size: 11px; letter-spacing: .2em; color: var(--dim); }
  .gauge-value { margin-left: auto; font-weight: 700; font-size: 22px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .gauge-limit { font-size: 11px; color: var(--faint); letter-spacing: .1em; }

  .track { height: 9px; background: #0a0e13; border: 1px solid var(--edge); position: relative; overflow: hidden; }
  .fill { position: absolute; inset: 1px auto 1px 1px; background: var(--armed); transition: width .4s cubic-bezier(.2,.7,.2,1), background .3s; }
  .fill.warn { background: var(--warn); }
  .fill.danger { background: var(--locked); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 11px; letter-spacing: .12em; color: var(--dim);
    border: 1px solid var(--edge); padding: 6px 11px;
  }
  .chip b { color: var(--text); font-weight: 500; }

  /* ---------- feed ---------- */
  .feed { background: var(--panel); border: 1px solid var(--edge); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .feed-head {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 20px; border-bottom: 1px solid var(--edge);
    font-size: 11px; letter-spacing: .2em; color: var(--dim);
  }
  .feed-stat { margin-left: auto; color: var(--faint); letter-spacing: .1em; }
  .feed-stat b { color: var(--locked); font-weight: 700; }
  .rows { overflow-y: auto; }

  .row {
    display: grid; grid-template-columns: 78px 132px 1fr; gap: 16px; align-items: start;
    padding: 13px 20px 13px 17px; border-bottom: 1px solid #131a22;
    border-left: 3px solid transparent;
    animation: enter .32s ease both;
  }
  .row.deny { border-left-color: var(--locked); }
  .row.allow { border-left-color: var(--armed); }
  @keyframes enter { from { opacity: 0; transform: translateX(-7px); } }

  .row time { color: var(--faint); font-size: 11px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .rule { font-size: 11px; font-weight: 700; letter-spacing: .02em; line-height: 1.5; }
  .row.deny .rule { color: var(--locked); }
  .row.allow .rule { color: var(--armed); }
  .detail { font-size: 12.5px; line-height: 1.7; color: #d3dde6; }
  .detail .what { color: #7c8b99; display: block; margin-top: 5px; font-size: 11px; letter-spacing: .04em; }

  .empty { padding: 44px 20px; text-align: center; color: var(--faint); font-size: 12px; letter-spacing: .14em; }

  .banner {
    border: 1px solid var(--locked); background: rgba(255,59,48,.08);
    padding: 14px 20px; font-size: 12px; line-height: 1.7; color: #ffd0cd; letter-spacing: .03em;
  }
  .banner b { color: var(--locked); letter-spacing: .16em; }

  @media (max-width: 1000px) { .top { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <header>
    <span class="wordmark">LEASH</span>
    <span class="tagline">POLICY LAYER · BINANCE AGENT OS</span>
    <span class="clock" id="clock">—</span>
  </header>

  <div id="banner"></div>

  <div class="top">
    <section class="status">
      <div class="lamp-row">
        <span class="lamp"></span>
        <span class="verdict" id="verdict">ARMED</span>
      </div>
      <p class="verdict-note" id="note">Đang canh mọi lệnh đi qua Binance MCP.</p>
      <button class="kill" id="kill" data-on="false">KILL SWITCH</button>
    </section>

    <section class="gauges">
      <div class="gauge">
        <div class="gauge-head">
          <span class="gauge-label">LỖ TRONG NGÀY</span>
          <span class="gauge-limit" id="pnl-limit">ngưỡng khoá 5%</span>
          <span class="gauge-value" id="pnl">0.00%</span>
        </div>
        <div class="track"><div class="fill" id="pnl-fill" style="width:0%"></div></div>
      </div>

      <div class="gauge">
        <div class="gauge-head">
          <span class="gauge-label">LỆNH TRONG GIỜ</span>
          <span class="gauge-limit" id="ord-limit">tối đa 6</span>
          <span class="gauge-value" id="orders">0</span>
        </div>
        <div class="track"><div class="fill" id="ord-fill" style="width:0%"></div></div>
      </div>

      <div class="gauge">
        <div class="gauge-head">
          <span class="gauge-label">CHỜ LỆNH KẾ TIẾP</span>
          <span class="gauge-limit" id="cd-limit">giãn cách 60s</span>
          <span class="gauge-value" id="cooldown">0s</span>
        </div>
        <div class="track"><div class="fill" id="cd-fill" style="width:0%"></div></div>
      </div>

      <div class="chips" id="chips"></div>
    </section>
  </div>

  <section class="feed">
    <div class="feed-head">
      <span>SỔ QUYẾT ĐỊNH</span>
      <span class="feed-stat" id="feed-stat"></span>
    </div>
    <div class="rows" id="rows"><div class="empty">CHƯA CÓ LỆNH NÀO ĐI QUA</div></div>
  </section>

<script>
const $ = (id) => document.getElementById(id);
let lastFeedKey = null;
const pct = (v, max) => Math.max(0, Math.min(100, (v / max) * 100));

function level(el, ratio) {
  el.classList.toggle("warn", ratio >= 0.6 && ratio < 0.9);
  el.classList.toggle("danger", ratio >= 0.9);
}

function timeOf(iso) {
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? "--:--:--" : d.toTimeString().slice(0, 8);
}

function render(s) {
  document.body.classList.toggle("locked", s.locked);

  $("verdict").textContent = s.locked ? "LOCKED" : "ARMED";
  $("note").textContent = s.tampered
    ? "State đã bị sửa ngoài Leash. Mọi lệnh bị chặn cho tới khi khôi phục."
    : s.locked
      ? "Kill switch đang bật. Lệnh mở mới bị chặn — lệnh đóng vị thế vẫn đi qua được."
      : "Đang canh mọi lệnh đi qua Binance MCP.";

  $("banner").innerHTML = s.tampered
    ? '<div class="banner"><b>CẢNH BÁO GIẢ MẠO</b> — ' + s.tampered + "</div>"
    : "";

  const kill = $("kill");
  kill.dataset.on = String(s.locked && !s.tampered);
  kill.textContent = s.locked ? "MỞ KHOÁ" : "KILL SWITCH";
  kill.disabled = Boolean(s.tampered);

  $("pnl").textContent = (s.pnl >= 0 ? "+" : "") + s.pnl.toFixed(2) + " USDT";
  $("pnl-limit").textContent = "ngưỡng khoá " + s.lossLimit + "%  ·  hiện " + s.lossPct.toFixed(2) + "%";
  const pnlRatio = s.lossPct / s.lossLimit;
  $("pnl-fill").style.width = pct(s.lossPct, s.lossLimit) + "%";
  level($("pnl-fill"), pnlRatio);

  $("orders").textContent = s.ordersLastHour + " / " + s.ordersLimit;
  $("ord-limit").textContent = "tối đa " + s.ordersLimit + " lệnh mỗi giờ";
  $("ord-fill").style.width = pct(s.ordersLastHour, s.ordersLimit) + "%";
  level($("ord-fill"), s.ordersLastHour / s.ordersLimit);

  $("cooldown").textContent = s.cooldownLeft + "s";
  $("cd-limit").textContent = "giãn cách " + s.cooldownLimit + "s";
  $("cd-fill").style.width = pct(s.cooldownLeft, s.cooldownLimit) + "%";
  level($("cd-fill"), s.cooldownLeft > 0 ? 0.7 : 0);

  $("chips").innerHTML = [
    "<span class='chip'>TRẦN MỖI LỆNH <b>" + s.maxNotional + " USDT</b></span>",
    "<span class='chip'>CHUỖI LỖ <b>" + s.lossStreak + "</b></span>",
    "<span class='chip'>NGÀY UTC <b>" + s.day + "</b></span>",
    "<span class='chip'>SYMBOL <b>" + s.symbols.join(" · ") + "</b></span>",
  ].join("");

  $("feed-stat").innerHTML =
    s.report.total + " quyết định · <b>" + s.report.denied + " bị chặn</b> · " +
    s.report.notionalBlocked.toFixed(2) + " USDT không ra tới sàn";

  // Rewriting this list every tick would restart the entry animation once a
  // second — a permanent flicker. Only redraw when the trail actually moved.
  const key = s.feed.length + "|" + (s.feed[0] ? s.feed[0].ts + s.feed[0].rule : "");
  if (key === lastFeedKey) return;
  lastFeedKey = key;

  $("rows").innerHTML = s.feed.length === 0
    ? '<div class="empty">CHƯA CÓ LỆNH NÀO ĐI QUA</div>'
    : s.feed.map((e) => {
        const denied = e.verdict === "DENY";
        const what = [e.side, e.notional != null ? e.notional + " USDT" : null, e.symbol]
          .filter(Boolean).join(" ");
        const body = denied
          ? (e.detail || "")
          : (e.agent_reason ? '"' + e.agent_reason + '"' : "Cho qua.");
        return (
          '<div class="row ' + (denied ? "deny" : "allow") + '">' +
            "<time>" + timeOf(e.ts) + "</time>" +
            '<span class="rule">' + (denied ? wrapRule(e.rule || "DENY") : "ALLOW") + "</span>" +
            '<span class="detail">' + escapeHtml(body) +
              (what ? '<span class="what">' + escapeHtml(what + "  ·  " + e.tool) + "</span>" : "") +
            "</span>" +
          "</div>"
        );
      }).join("");
}

/** Let long rule names break after underscores rather than mid-word. */
function wrapRule(rule) {
  return escapeHtml(rule).replace(/_/g, "_<wbr>");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function tick() {
  try {
    const r = await fetch("/api/status");
    render(await r.json());
  } catch {
    $("note").textContent = "Mất kết nối tới dashboard server.";
  }
  $("clock").textContent = new Date().toTimeString().slice(0, 8);
}

$("kill").addEventListener("click", async () => {
  const turningOn = $("kill").dataset.on !== "true";
  await fetch("/api/kill", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ on: turningOn }),
  });
  tick();
});

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
